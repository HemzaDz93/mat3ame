; ==================================================================
;  إعدادات PHP على Wasmer Edge
;  يقرأها المحرّك عبر المتغير PHPRC=/app/wasmer/
; ==================================================================

; رفع الملفات (استيراد Excel والمستندات)
upload_max_filesize = 25M
post_max_size = 30M

max_execution_time = 120
max_input_time = 120
max_input_vars = 5000

memory_limit = 256M

; إخفاء الأخطاء وبصمة PHP في بيئة الإنتاج
display_errors = Off
display_startup_errors = Off
expose_php = Off
log_errors = On

; المنطقة الزمنية
date.timezone = Africa/Algiers

; ترميز افتراضي
default_charset = "UTF-8"
