<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes -MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    # الحاوية تخدم عبر HTTP فقط؛ إخبار mod_rewrite بأن الاتصال «آمن»
    # يمنع إعادة التوجيه اللانهائية إلى HTTPS الموجودة في public/.htaccess
    SetEnv HTTPS on

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
